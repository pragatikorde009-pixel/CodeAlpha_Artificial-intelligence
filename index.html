<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Translator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Translate</h1>
    <p>Type or paste text, pick a source and target language, and translate. Copy the result or have it read aloud.</p>
  </header>

  <div class="lang-row">
    <select id="sourceLang"></select>
    <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>
    <select id="targetLang"></select>
  </div>

  <div class="panes">
    <div class="pane">
      <div class="pane-label">Enter text</div>
      <textarea id="inputText" placeholder="Start typing..." maxlength="1000"></textarea>
      <div class="pane-footer">
        <span class="char-count" id="charCount">0 / 1000</span>
        <button class="icon-btn" id="listenInputBtn" title="Listen to source text">🔊 Listen</button>
      </div>
    </div>
    <div class="pane">
      <div class="pane-label">Translation</div>
      <div class="output-text placeholder" id="outputText">Your translation will appear here.</div>
      <div class="pane-footer">
        <button class="icon-btn" id="copyBtn" disabled>📋 Copy</button>
        <button class="icon-btn" id="listenOutputBtn" disabled title="Listen to translation">🔊 Listen</button>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="translate-btn" id="translateBtn">Translate</button>
    <span class="status" id="statusMsg"></span>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
